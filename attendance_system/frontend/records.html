<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Records - AttendancePro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-inter h-screen flex overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-indigo-600">Attendance<span class="text-gray-800">Pro</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <a href="portal.html" class="block px-4 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-50">Dashboard</a>
            <a href="attendance.html" class="block px-4 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-50">Live Attendance</a>
            <a href="records.html" class="block px-4 py-2 text-sm font-medium rounded-md bg-indigo-50 text-indigo-700">Past Records</a>
            <a href="reports.html" class="block px-4 py-2 text-sm font-medium rounded-md text-gray-700 hover:bg-gray-50">Class Reports</a>
        </nav>
        <div class="p-4 border-t border-gray-200">
            <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-md">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
        
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-gray-900">Past Records</h2>
            <div class="flex items-center gap-2">
                <label class="text-sm font-medium text-gray-700">Filter by Date:</label>
                <input type="date" id="date-filter" class="px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Section & Batch</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Time Slot</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Present / Total</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                    </tr>
                </thead>
                <tbody id="records-list" class="bg-white divide-y divide-gray-200">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
            
            <div id="empty-state" class="hidden text-center py-12">
                <p class="text-gray-500">No attendance records found for this date.</p>
            </div>
        </div>
        
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();

        document.addEventListener('DOMContentLoaded', () => {
            const dateFilter = document.getElementById('date-filter');
            dateFilter.value = new Date().toISOString().split('T')[0];
            dateFilter.addEventListener('change', fetchRecords);
            fetchRecords();
        });

        async function fetchRecords() {
            const date = document.getElementById('date-filter').value;
            const tbody = document.getElementById('records-list');
            const emptyState = document.getElementById('empty-state');
            
            tbody.innerHTML = '';
            
            try {
                const sessions = await apiFetch(`/attendance/sessions?query_date=${date}`);
                
                if(sessions.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                
                emptyState.classList.add('hidden');
                
                sessions.forEach(session => {
                    const total = session.records.length;
                    const present = session.records.filter(r => r.status === 'PRESENT').length;
                    
                    // Simple formatting for time
                    const start = session.start_time.substring(0, 5);
                    const end = session.end_time.substring(0, 5);

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4">
                                <div class="text-sm font-medium text-gray-900">${session.section.name}</div>
                                <div class="text-xs text-gray-500">Batch: ${session.batch_type}</div>
                            </td>
                            <td class="px-6 py-4 text-sm text-gray-700">${start} - ${end}</td>
                            <td class="px-6 py-4 text-center text-sm font-medium">
                                <span class="text-green-600">${present}</span> / ${total}
                            </td>
                            <td class="px-6 py-4 text-right text-sm font-medium">
                                <button onclick="editSession(${session.id})" class="text-indigo-600 hover:text-indigo-900">Edit</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                alert('Failed to load records: ' + e.message);
            }
        }

        function editSession(id) {
            // For editing, we should navigate to attendance page with session ID, 
            // but since it's vanilla JS, we can just alert it's not fully wired or implement localStorage passing
            alert("Edit feature would typically reopen the attendance.html page pre-filled with this session data (Session ID: " + id + ").");
        }
    </script>
</body>
</html>
