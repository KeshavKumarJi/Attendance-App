<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Attendance Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-800 font-inter antialiased">
    <div id="app" class="min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-indigo-600">Attendance<span class="text-gray-800">Pro</span></h1>
                </div>
                <div class="text-right">
                    <p class="font-semibold" id="teacher-name">John Doe</p>
                    <p class="text-sm text-gray-500" id="current-date"></p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">
            
            <!-- Controls Section -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-8 flex flex-col md:flex-row gap-4 items-end justify-between">
                <div class="w-full md:w-1/3">
                    <label for="class-select" class="block text-sm font-medium text-gray-700 mb-2">Select Class</label>
                    <div class="relative">
                        <select id="class-select" class="block w-full pl-3 pr-10 py-2.5 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg bg-gray-50 border appearance-none cursor-pointer">
                            <option value="" disabled selected>Loading classes...</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-1/3">
                    <label for="date-select" class="block text-sm font-medium text-gray-700 mb-2">Select Date</label>
                    <div class="relative">
                        <input type="date" id="date-select" class="block w-full px-3 py-2.5 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-lg bg-gray-50 border cursor-pointer">
                    </div>
                </div>

                <div id="quick-actions" class="hidden flex gap-2 w-full md:w-auto">
                    <button onclick="markAll('Present')" class="flex-1 md:flex-none px-4 py-2 border border-transparent text-sm font-medium rounded-md text-green-700 bg-green-100 hover:bg-green-200 focus:outline-none transition-colors">
                        Mark All Present
                    </button>
                    <button onclick="markAll('Absent')" class="flex-1 md:flex-none px-4 py-2 border border-transparent text-sm font-medium rounded-md text-red-700 bg-red-100 hover:bg-red-200 focus:outline-none transition-colors">
                        Mark All Absent
                    </button>
                </div>
            </div>

            <!-- Empty State / Loading State -->
            <div id="loading-state" class="hidden flex justify-center py-12">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
            </div>
            
            <div id="empty-state" class="text-center py-16 bg-white rounded-xl border border-gray-100 shadow-sm">
                <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900">No class selected</h3>
                <p class="mt-1 text-sm text-gray-500">Please select a class from the dropdown above to view students.</p>
            </div>

            <!-- Students List -->
            <div id="students-container" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">Roll No</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student Name</th>
                                <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Attendance Status</th>
                            </tr>
                        </thead>
                        <tbody id="students-list" class="bg-white divide-y divide-gray-200">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
                
                <div class="bg-gray-50 px-6 py-4 flex items-center justify-end border-t border-gray-200">
                    <button id="submit-btn" onclick="submitAttendance()" class="inline-flex items-center px-6 py-2.5 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        <span id="submit-text">Submit Attendance</span>
                        <svg id="submit-spinner" class="hidden ml-2 animate-spin -mr-1 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
        
        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
            <div class="bg-white border-l-4 rounded shadow-lg p-4 max-w-sm flex items-start" id="toast-content">
                <!-- Toast content goes here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
